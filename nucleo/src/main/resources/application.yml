spring:
  application:
    name: freteja

plugins:
  diretorio: ${PLUGINS_DIR:./plugins-ativos}
  intervalo-ms: 3000
  tempo-limite-ms: 2000

circuito:
  janela-de-chamadas: 4
  minimo-de-chamadas: 3
  taxa-de-falha-percentual: 50
  tempo-aberto-segundos: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.edu.ifsp.freteja: INFO
