spring:
  application:
    name: freteja
  cache:
    type: redis
    cache-names: cotacoes
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

plugins:
  diretorio: ${PLUGINS_DIR:./plugins-ativos}
  intervalo-ms: 3000
  tempo-limite-ms: 2000

circuito:
  janela-de-chamadas: 4
  minimo-de-chamadas: 3
  taxa-de-falha-percentual: 50
  tempo-aberto-segundos: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.edu.ifsp.freteja: INFO
